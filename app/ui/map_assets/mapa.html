<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body, #mapa { height: 100%; width: 100%; margin: 0; padding: 0; background: #e5e9f0; }
  body { font-family: "Segoe UI", sans-serif; }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-container.modo-cruz { cursor: crosshair; }

  .rotulo {
    position: absolute; z-index: 1000; pointer-events: none;
    background: rgba(255,255,255,0.93); color: #1a1d21; border: 1px solid #cfd6e2;
    border-radius: 6px; padding: 4px 9px; font-size: 12px; display: none;
  }
  #rotulo-distancia { top: 10px; left: 54px; }
  #rotulo-cursor { bottom: 22px; left: 10px; font-size: 11px; }
  #aviso-sin-conexion { top: 10px; right: 54px; background: #fff3e0; border-color: #ffb74d; color: #e65100; }

  .marcador-cuartel div {
    width: 30px; height: 30px; border-radius: 50%; background: #1565c0; border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-sizing: border-box;
  }
  .marcador-siniestro svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.55)); }
  .vertice div {
    width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #ff5722;
    box-sizing: border-box; cursor: move;
  }
  /* Ícono del selector de capas sin depender de images/layers.png */
  .leaflet-control-layers-toggle { background-image: none !important; display: flex !important;
    align-items: center; justify-content: center; font-size: 20px; text-decoration: none; }
  .leaflet-control-layers-toggle::after { content: "🗺️"; }
  /* La atribución va en la franja de la imagen exportada (acá saldría recortada) */
  body.captura .leaflet-control-zoom, body.captura .leaflet-control-layers,
  body.captura .leaflet-control-attribution, body.captura .rotulo { display: none !important; }
</style>
</head>
<body>
<div id="mapa"></div>
<div id="rotulo-distancia" class="rotulo"></div>
<div id="rotulo-cursor" class="rotulo"></div>
<div id="aviso-sin-conexion" class="rotulo">⚠ Sin conexión: el fondo del mapa no carga (marcar puntos sigue funcionando).</div>
<script src="leaflet.js"></script>
<script src="qwebchannel.js"></script>
<script>
"use strict";
// Visor de Fire Station. Python (app/ui/widgets/map_widget.py) es dueño del
// estado: esta página solo DIBUJA lo que le mandan por `fs.*` (runJavaScript)
// y AVISA clics, teclas y vértices movidos por el objeto `puente` (QWebChannel).
// Todo en WGS84 (lat/lon): Leaflet proyecta a Web Mercator solo para dibujar.

const COLOR_SINIESTRO = "#d32f2f", COLOR_CUARTEL = "#1565c0", COLOR_POLIGONO = "#ff5722";

const mapa = L.map("mapa", { zoomControl: true, minZoom: 3, maxZoom: 19, doubleClickZoom: true })
  .setView([-33.6315, -64.0152], 14);
mapa.attributionControl.setPrefix(false);

const capaCalles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; colaboradores de OpenStreetMap",
});
const capaSatelital = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, maxNativeZoom: 18, attribution: "Imágenes &copy; Esri" });
capaCalles.addTo(mapa);
L.control.layers({ "Calles (OpenStreetMap)": capaCalles, "Satelital (Esri)": capaSatelital }, null,
                 { position: "topright" }).addTo(mapa);

let erroresTesela = 0;
[capaCalles, capaSatelital].forEach((capa) => {
  capa.on("tileerror", () => {
    if (++erroresTesela > 3) document.getElementById("aviso-sin-conexion").style.display = "block";
  });
  capa.on("tileload", () => {
    erroresTesela = 0;
    document.getElementById("aviso-sin-conexion").style.display = "none";
  });
});

// El widget puede crearse oculto (pestaña, diálogo sin mostrar): sin esto
// Leaflet calcula mal el tamaño y queda gris o cortado.
// Un encuadre pedido mientras el widget todavía no tiene su tamaño real
// (Qt arranca los widgets en ~100 px) daría un zoom demasiado alejado: se
// guarda y se aplica cuando el mapa toma su tamaño.
const ANCHO_MINIMO_ENCUADRE = 300;
let encuadrePendiente = null;
new ResizeObserver(() => {
  mapa.invalidateSize();
  if (encuadrePendiente && mapa.getSize().x >= ANCHO_MINIMO_ENCUADRE) {
    const [lat, lng, km] = encuadrePendiente;
    encuadrePendiente = null;
    fs.encuadrar(lat, lng, km);
  }
}).observe(document.getElementById("mapa"));

const iconoCuartel = L.divIcon({ className: "marcador-cuartel", html: "<div>🚒</div>",
                                 iconSize: [30, 30], iconAnchor: [15, 15] });
function iconoSiniestro(escala) {
  const w = Math.round(28 * escala), h = Math.round(38 * escala);
  return L.divIcon({
    className: "marcador-siniestro", iconSize: [w, h], iconAnchor: [w / 2, h],
    html: `<svg width="${w}" height="${h}" viewBox="0 0 28 38"><path d="M14 1C7 1 1.5 6.4 1.5 13.2 1.5 22 14 37 14 37S26.5 22 26.5 13.2C26.5 6.4 21 1 14 1z" fill="${COLOR_SINIESTRO}" stroke="#fff" stroke-width="2"/><circle cx="14" cy="13" r="4.6" fill="#fff"/></svg>`,
  });
}
const iconoVertice = L.divIcon({ className: "vertice", html: "<div></div>", iconSize: [12, 12], iconAnchor: [6, 6] });

let puente = null;
let editable = false;
let modo = "normal";  // "normal" | "dibujo" | "edicion"
let cuartel = null, siniestro = null, lineas = [], poligono = null, trazo = null;
let vertices = [], capaSoloLectura = L.featureGroup().addTo(mapa);

// ---------------------------------------------------------------------------
// Eventos hacia Python
// ---------------------------------------------------------------------------
let ultimoClic = { t: 0, x: -99, y: -99 };
mapa.on("click", (e) => {
  if (!editable || !puente) return;
  // En modo dibujo el doble clic produce dos "click": el segundo no es un vértice.
  const ahora = Date.now(), p = e.containerPoint;
  const repetido = ahora - ultimoClic.t < 400 && Math.abs(p.x - ultimoClic.x) + Math.abs(p.y - ultimoClic.y) <= 5;
  ultimoClic = { t: ahora, x: p.x, y: p.y };
  if (modo === "dibujo" && repetido) return;
  puente.clic(e.latlng.lat, e.latlng.lng);
});
mapa.on("dblclick", () => { if (editable && puente && modo === "dibujo") puente.doble_clic(); });
mapa.on("mousemove", (e) => {
  const r = document.getElementById("rotulo-cursor");
  r.textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
  r.style.display = "block";
});
mapa.on("mouseout", () => { document.getElementById("rotulo-cursor").style.display = "none"; });
document.addEventListener("keydown", (e) => {
  if (!puente) return;
  if (e.key === "Enter") puente.tecla("enter");
  else if (e.key === "Escape") puente.tecla("escape");
});

// ---------------------------------------------------------------------------
// API para Python
// ---------------------------------------------------------------------------
const fs = {
  configurar(esEditable) { editable = !!esEditable; },

  cuartel(lat, lng) {
    if (cuartel) cuartel.setLatLng([lat, lng]);
    else cuartel = L.marker([lat, lng], { icon: iconoCuartel, keyboard: false, zIndexOffset: 1000, interactive: true })
      .bindTooltip("Cuartel de Bomberos", { direction: "top", offset: [0, -14] }).addTo(mapa);
  },

  // Chincheta + línea punteada al cuartel. lat === null la quita.
  siniestro(lat, lng, rotuloHtml) {
    lineas.forEach((l) => mapa.removeLayer(l));
    lineas = [];
    if (lat === null || lat === undefined) {
      if (siniestro) { mapa.removeLayer(siniestro); siniestro = null; }
      fs.rotulo(null);
      return;
    }
    if (siniestro) siniestro.setLatLng([lat, lng]);
    else siniestro = L.marker([lat, lng], { icon: iconoSiniestro(1), keyboard: false, zIndexOffset: 900,
                                            interactive: false }).addTo(mapa);
    if (cuartel) {
      const tramo = [cuartel.getLatLng(), [lat, lng]];
      lineas.push(L.polyline(tramo, { color: "#fff", weight: 6, opacity: 0.9, interactive: false }).addTo(mapa));
      lineas.push(L.polyline(tramo, { color: COLOR_CUARTEL, weight: 3, dashArray: "8 6", interactive: false }).addTo(mapa));
    }
    fs.rotulo(rotuloHtml);
  },

  rotulo(html) {
    const r = document.getElementById("rotulo-distancia");
    r.innerHTML = html || "";
    r.style.display = html ? "block" : "none";
  },

  // anillo: [[lat, lng], ...] sin cerrar. modoNuevo: "normal" | "dibujo" | "edicion".
  poligono(anillo, modoNuevo) {
    modo = modoNuevo;
    [poligono, trazo].forEach((c) => { if (c) mapa.removeLayer(c); });
    poligono = trazo = null;
    document.getElementById("mapa").classList.toggle("modo-cruz", modo === "dibujo");
    if (modo === "dibujo") mapa.doubleClickZoom.disable(); else mapa.doubleClickZoom.enable();
    if (!anillo || !anillo.length) return;
    if (modo === "dibujo") {
      trazo = L.featureGroup([
        L.polyline(anillo, { color: COLOR_POLIGONO, weight: 2, dashArray: "6 5", interactive: false }),
        ...anillo.map((p) => L.circleMarker(p, { radius: 4, color: COLOR_POLIGONO, weight: 2, fillColor: "#fff",
                                                 fillOpacity: 1, interactive: false })),
      ]).addTo(mapa);
    } else {
      poligono = L.polygon(anillo, { color: COLOR_POLIGONO, weight: 3, fillOpacity: 0.25, interactive: false }).addTo(mapa);
    }
  },

  // Vértices arrastrables (modo edición). null los quita.
  vertices(anillo) {
    vertices.forEach((v) => mapa.removeLayer(v));
    vertices = [];
    (anillo || []).forEach((p, i) => {
      const v = L.marker(p, { icon: iconoVertice, draggable: true, zIndexOffset: 2000, keyboard: false }).addTo(mapa);
      v.on("drag", (e) => {
        const ll = e.target.getLatLng();
        if (poligono) {
          const puntos = poligono.getLatLngs()[0];
          puntos[i] = ll;
          poligono.setLatLngs(puntos);
        }
      });
      v.on("dragend", (e) => {
        const ll = e.target.getLatLng();
        if (puente) puente.vertice_movido(i, ll.lat, ll.lng);
      });
      v.on("click", (e) => L.DomEvent.stopPropagation(e));  // un clic en el vértice no termina la edición
      vertices.push(v);
    });
  },

  // items: [{lat, lng, etiqueta, anillo: [[lat, lng], ...] | null}]
  soloLectura(items) {
    capaSoloLectura.clearLayers();
    (items || []).forEach((it) => {
      if (it.anillo && it.anillo.length >= 3) {
        L.polygon(it.anillo, { color: COLOR_POLIGONO, weight: 2, fillOpacity: 0.15 })
          .bindTooltip(it.etiqueta ? `Parte N° ${it.etiqueta}` : "Siniestro").addTo(capaSoloLectura);
      }
      L.marker([it.lat, it.lng], { icon: iconoSiniestro(0.8), keyboard: false })
        .bindTooltip(it.etiqueta ? `Parte N° ${it.etiqueta}` : "Siniestro", { direction: "top", offset: [0, -28] })
        .addTo(capaSoloLectura);
    });
  },

  centrar(lat, lng) {
    if (encuadrePendiente) encuadrePendiente = [lat, lng, encuadrePendiente[2]];
    mapa.setView([lat, lng], mapa.getZoom(), { animate: false });
  },

  // Zoom de barrio: ~anchoKm de ancho en pantalla, centrado en el punto.
  encuadrar(lat, lng, anchoKm) {
    const anchoReal = mapa.getSize().x;
    encuadrePendiente = anchoReal < ANCHO_MINIMO_ENCUADRE ? [lat, lng, anchoKm] : null;
    const anchoPx = Math.max(anchoReal, 800);
    const mPorPx = (anchoKm * 1000) / anchoPx;
    const z = Math.log2((156543.03392 * Math.cos(lat * Math.PI / 180)) / mPorPx);
    mapa.setView([lat, lng], Math.max(3, Math.min(18, Math.floor(z))), { animate: false });
  },

  // bounds: [[sur, oeste], [norte, este]]
  ajustar(bounds) { mapa.fitBounds(bounds, { padding: [40, 40], maxZoom: 17, animate: false }); },

  zoom(delta) { mapa.setZoom(mapa.getZoom() + delta); },

  // Captura para el PDF: oculta controles, centra sin animar y avisa a
  // Python cuando las teselas visibles terminaron de cargar.
  prepararCaptura(lat, lng) {
    document.body.classList.add("captura");
    mapa.setView([lat, lng], mapa.getZoom(), { animate: false });
    const capa = mapa.hasLayer(capaSatelital) ? capaSatelital : capaCalles;
    let avisado = false;
    const avisar = () => { if (!avisado) { avisado = true; if (puente) puente.captura_lista(); } };
    capa.once("load", avisar);
    // Si no quedó ninguna tesela pendiente, 'load' no se dispara.
    setTimeout(() => { if (!capa._loading) avisar(); }, 120);
  },

  terminarCaptura() { document.body.classList.remove("captura"); },
};

new QWebChannel(qt.webChannelTransport, (canal) => {
  puente = canal.objects.puente;
  puente.listo();
});
</script>
</body>
</html>
